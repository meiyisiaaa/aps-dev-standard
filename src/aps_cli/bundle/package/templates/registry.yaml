# yaml-language-server: $schema=./schemas/registry.schema.json
schema_version: 1
standard_version: "1.3.6"
revision: 1

sources:
  lifecycle_standard:
    domain: Lifecycle Standard
    path: .ai/standards/lifecycle.md
    status: ACTIVE
    load_policy: stage
  artifact_standard:
    domain: Artifact Standard
    path: .ai/standards/artifact-state.md
    status: ACTIVE
    load_policy: bootstrap/on-demand
  project_state:
    domain: Project State
    path: .ai/state.yaml
    status: ACTIVE
    load_policy: always-minimal
  decisions:
    domain: Decisions
    path: .ai/decisions.md
    status: ACTIVE
    load_policy: referenced-only
  project_profile:
    domain: Project Governance Profile
    path: .ai/project-profile.json
    status: ACTIVE
    load_policy: always-minimal
  transition_audit:
    domain: Transition Audit
    path: .ai/audit/transitions.jsonl
    status: ACTIVE
    load_policy: stage/on-demand
  release_readiness:
    domain: Release Readiness
    path: .ai/release-readiness.json
    status: ACTIVE
    load_policy: release-only

# Optional Artifact dependency graph. Fill only for real project Sources of Truth;
# do not invent nodes just to make the graph look complete.
# artifacts:
#   requirements:
#     path: .ai/cycles/CYCLE-001/stages/08-requirements/08_REQUIREMENTS.md
#     stage: 8
#     status: ACTIVE
#     depends_on: [product_dna, functions]
#     verification: [requirements-review]
# dependencies:
#   product_dna: [functions, requirements, ux, ui]
artifacts: {}
dependencies: {}
critical_skills: {}
