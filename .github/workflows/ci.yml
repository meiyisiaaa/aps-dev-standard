name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: CLI help
        run: python aps.py --help
      - name: Standards lint
        run: python src/aps_cli/bundle/package/tools/standards-lint.py
      - name: POSIX installer syntax
        if: runner.os == 'Linux'
        shell: bash
        run: bash -n install.sh
      - name: PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Install and release smoke test
        run: python scripts/smoke_test.py
